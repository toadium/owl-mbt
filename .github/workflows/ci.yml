name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [native, wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Moon version
        run: moon version

      - name: Moon check (deny-warn)
        run: moon check --deny-warn --target ${{ matrix.target }}

      - name: Moon test
        run: moon test --target ${{ matrix.target }}

      - name: Moon info (contract check)
        if: matrix.target == 'native'
        run: |
          moon info --target native
          git diff --exit-code -- '*.mbti' || (echo "Public API changed: pkg.generated.mbti diff detected. Record the change in CHANGELOG.md (Breaking/Added/Changed), update docs/migration-*.md if breaking, and commit the regenerated .mbti files." && exit 1)

      - name: Moon fmt check
        if: matrix.target == 'native'
        run: |
          moon fmt
          git diff --exit-code || (echo "Code formatting check failed. Run 'moon fmt' and commit the changes." && exit 1)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Moon version
        run: moon version

      - name: Moon check
        run: moon check

      - name: Moon test
        run: moon test

      - name: Moon fmt check
        run: |
          moon fmt
          git diff --exit-code || (echo "Code formatting check failed. Run 'moon fmt' and commit the changes." && exit 1)
